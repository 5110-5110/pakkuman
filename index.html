<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>パクパクゲーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>🟡 パクパクゲーム 👻</h1>
        <div class="score-board">
            <p>スコア: <span id="score">0</span> 点</p>
        </div>
        
        <!-- マップ -->
        <div id="grid" class="grid"></div>

        <!-- スマホ用コントローラー -->
        <div class="controller">
            <button class="ctrl-btn" id="btn-up">⬆️</button>
            <div class="middle-btns">
                <button class="ctrl-btn" id="btn-left">⬅️</button>
                <button class="ctrl-btn" id="btn-right">➡️</button>
            </div>
            <button class="ctrl-btn" id="btn-down">⬇️</button>
        </div>

        <button id="restart-btn">もう一度遊ぶ</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
